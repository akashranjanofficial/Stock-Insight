kind = "web"
previewPath = "/"
title = "Indian Stock Analyzer"
version = "1.0.0"
id = "artifacts/indian-stock-analyzer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18481

[services.development]
run = "pnpm --filter @workspace/indian-stock-analyzer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/indian-stock-analyzer", "run", "build" ]
publicDir = "artifacts/indian-stock-analyzer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18481"
BASE_PATH = "/"
